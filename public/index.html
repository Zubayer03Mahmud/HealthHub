<!DOCTYPE html>
<html lang="en">
<head>

	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<header class="navbar">

			<nav class="nav-links">

		</div>

	<main id="app-root"></main>

	<footer class="footer">

	</footer>

	<script src="/views/api-client.js"></script>
	<script src="/views/emergency.js"></script>
	<script>
		document.addEventListener( 'DOMContentLoaded', () => {
			const container = document.getElementById( 'app-root' );

				EmergencyView.render( container );
			}
		} );
	</script>
